# fly.toml app configuration file generated for zikibols on 2026-09-12T18:16:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zikibols'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    NEXT_PUBLIC_CAMPAIGN_TREASURY = '0x7d5710637321f540b9ee8e1282c598d9b78f4f91'
    NEXT_PUBLIC_PRIVY_APP_ID = 'cmtslgrsc009k0bjo1acmxw8t'

[env]
  HEDERA_HCS_TOPIC_ID = '0.0.10421775'
  HEDERA_PAY_TO_ACCOUNT = '0.0.10421774'
  HOSTNAME = '0.0.0.0'
  NEXT_PUBLIC_CAMPAIGN_TREASURY = '0x7d5710637321f540b9ee8e1282c598d9b78f4f91'
  PORT = '3000'
  ZIKIBOLS_DATA_PATH = '/data/state.json'

[[mounts]]
  source = 'zikibols_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/status'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
